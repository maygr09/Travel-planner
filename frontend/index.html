<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Travel Planner</title>

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/cards.css" />
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/trip.css" />
  <link rel="stylesheet" href="css/forms.css" />
  <link rel="stylesheet" href="css/index.css" />
</head>
<body>

<div class="page">

  <header class="hero">
    <h1>✈️ Travel Planner</h1>
    <p>Plan your trips, compare versions, visualize your journey.</p>
  </header>

  <section class="cards">

    <!-- SEARCH -->
    <div class="card">
      <h2>🔍 Find a trip</h2>
      <input id="searchTrip" placeholder="Trip name" />
      <button id="searchBtn">Open trip</button>
    </div>

    <!-- CREATE -->
    <div class="card">
      <h2>➕ Create a new trip</h2>
      <p>Start planning a new adventure</p>
      <button id="createBtn">Create trip</button>
    </div>

  </section>

</div>

<script type="module" src="js/index.js"></script>
</body>
</html>
