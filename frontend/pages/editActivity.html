<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Edit Activity</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/trip.css" />
  <link rel="stylesheet" href="../css/forms.css" />
</head>
<body>

<form id="editForm">
  <div class="page">
    <div class="card">
      <h1 id="title">Edit Activity</h1>

    <div class="form-group">
      <label>Name</label>
      <input id="aName" />
    </div>

    <div class="form-group">
      <label>Start date</label>
      <input id="aStartDate" type="date" />
    </div>

    <div class="form-group">
      <label>Start time</label>
      <input id="aStartTime" type="time" />
    </div>

    <div class="form-group">
      <label>End date</label>
      <input id="aEndDate" type="date" />
    </div>

    <div class="form-group">
      <label>End time</label>
      <input id="aEndTime" type="time" />
    </div>

    <div class="form-group">
      <label>Cost</label>
      <input id="aCost" type="number" />
    </div>

    <div class="form-group">
      <label>Currency</label>
      <input id="aCurrency" />
    </div>

    <div class="actions">
       <button type="button" class="secondary" id="cancelActivity">
          Cancel
        </button>
        <button id="saveActivity"type="button" class="primary">
          Save
        </button>
    </div>
  </div>
</div>
</form>

<script type="module" src="../js/editActivity.js"></script>
</body>
</html>
