<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Edit Accommodation</title>
  <link rel="stylesheet" href="../css/forms.css" />
</head>
<body>

<form id="editForm">
  <div class="page">
    <div class="card">
      <h1>Edit Accommodation</h1>

      <div class="form-group">
        <label>Name</label>
        <input id="accName" placeholder="Hotel/Airbnb" />
      </div>

      <div class="form-group">
        <label>City</label>
        <input id="accCity" placeholder="City" />
      </div>

      <div class="form-group">
        <label>Check in</label>
        <input id="accCheckInDate" type="date" required />
        <input id="accCheckInTime" type="time" required />
      </div>

      <div class="form-group">
        <label>Check out</label>
        <input id="accCheckOutDate" type="date" required />
        <input id="accCheckOutTime" type="time" required />
      </div>

      <div class="form-group">
        <label>Cost</label>
        <input id="accCost" type="number" />
      </div>

      <div class="form-group">
        <label>Currency</label>
        <input id="accCurrency" />
      </div>

      <div class="form-group">
        <label>Booking Code</label>
        <input id="accBookingCode" placeholder="Confirmation Code" />
        <input id="accBookingUrl" placeholder="Link" />
      </div>

      <div class="actions">
        <button type="button" class="secondary" id="cancelAccommodation">
          Cancel
        </button>
        <button type="submit" class="primary">
          Save
        </button>
      </div>
    </div>
  </div>
</form>

<script type="module" src="../js/editAccommodation.js"></script>
</body>
</html>
