<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Edit trip</title>
</head>
<body>

  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/trip.css" />
  <link rel="stylesheet" href="../css/forms.css" />
  <link rel="stylesheet" href="../css/app.css" />

<div class="page">
  <div class="card wide">

<h1 id="tripTitle">Edit trip</h1>

<!-- VERSIONS -->
<section>
  <div class="section-card">
  <h2>Version</h2>
   <div id="versionList"></div>
  <select id="versionSelect"></select>
  <button id="duplicateVersion">Duplicate active version</button>
  <button id="activateVersion">Set as active</button>
  </div>
</section>



<section>
  <div class="grid two">
  <div class="section-card">
  <h2>Basic info</h2>
  <input id="peopleCount" type="number" placeholder="People count" />
  <button id="saveBasic">Save</button>
  </div>

  <div class="section-card">
  <h2>Currencies</h2>
  <input id="currencyCode" placeholder="EUR" />
  <input id="exchangeRate" type="number" placeholder="Rate to MXN" />
  <button id="addCurrency">Add currency</button>

  <ul id="currencyList"></ul>
  </div>
</div>

</section>

<hr />

<!-- TRANSPORTS -->
<section>
  <div class="section-card">
  <h2>Transports</h2>

  <!-- ADD TRANSPORT FORM -->
  <input id="tType" placeholder="Type (flight, train, bus)" />
  <input id="tFlightNumber" placeholder="Flight / ref number" />
  <input id="tFrom" placeholder="From" />
  <input id="tTo" placeholder="To" />
  <input id="tDepartureDate" type="date" />
  <input id="tDepartureTime" type="time" />
  <input id="tArrivalDate" type="date" />
  <input id="tArrivalTime" type="time" />
  <input id="tConfirmationCode" placeholder="Confirmation code" />
  <input id="tBookingUrl" placeholder="Booking URL" />
  <input id="tCost" type="number" placeholder="Cost" />
  <input id="tCurrency" placeholder="Currency" />

  <button id="addTransport">Add transport</button>

  <div id="transportList"></div>
  </div>
</section>



<!-- ACTIVITIES -->
<section>
  <div class="section-card">
  <h2>Activities</h2>
  <input id="activityName" placeholder="Activity name" />
  <input id="activityStartDate" type="date" />
  <input id="activityStartTime" type="time" />
  <input id="activityEndDate" type="date" />
  <input id="activityEndTime" type="time" />
  <input id="activityConfirmationCode" placeholder="Confirmation code" />
  <input id="activityCost" type="number" placeholder="Cost" />
  <input id="activityCurrency" placeholder="Currency" />
  <button id="addActivity">Add activity</button>
  <div id="activityList"></div>
  </div>
</section>

<!-- ACCOMMODATION -->


<section>
  <div class="section-card">
  <h2>Accommodation</h2>

  <input id="accName" placeholder="Hotel / Airbnb" />
  <input id="accCity" placeholder="City" />
  <input id="accCheckIn" type="date" />
  <input id="accCheckInTime" type="time" />
  <input id="accCheckOut" type="date" />
  <input id="accCheckOutTime" type="time" />
  <input id="accCost" type="number" placeholder="Total cost" />
  <input id="accCurrency" placeholder="Currency" />
  <input id="accBookingCode" placeholder="Booking code (optional)" />
  <input id="accBookingUrl" placeholder="Booking URL (optional)" />

  <button id="addAccommodation">Add accommodation</button>

  <div id="accommodationList"></div>
  </div>
</section>

<!-- MEALS -->
<section>
  <div class="section-card">
  <h2>Meals</h2>
  <input id="mealName" placeholder="Meal" />
  <input id="mealStartDate" type="date" />
  <input id="mealStartTime" type="time" />
  <input id="mealEndDate" type="date" />
  <input id="mealEndTime" type="time" />
  <input id="mealConfirmationCode" placeholder="Confirmation code" />
  <input id="mealBookingUrl" placeholder="Booking URL" />
  <input id="mealCost" type="number" placeholder="Cost" />
  <input id="mealCurrency" placeholder="Currency" />
  <button id="addMeal">Add meal</button>
  <div id="mealList"></div>
  </div>
</section>

<hr />

<!-- MINI SUMMARY -->
<section>
  <div class="grid two">
  <div class="section-card">
  <h2>Summary (current version)</h2>
  <pre id="summary"></pre>
  </div>


  <div class="section-card">
  <h2>Compare versions</h2>
  <div id="versionsCompare"></div>
  </div>
  </div>
</section>


<!-- NAVIGATION -->
<section>
  <div class="section-card">
  <button id="goToTrip">View final trip</button>
  </div>
</section>

  </div>
</div>

<script type="module" src="../js/editTrip.js"></script>
</body>
</html>
