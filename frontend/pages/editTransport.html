<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Edit transport</title>
</head>
<body>

<link rel="stylesheet" href="../css/forms.css" />

<form id="editForm">
<div class="page">
  <div class="card">
    <h1>Edit Transport</h1>

    <div class="form-group">
      <label>Type</label>
      <input id="type" placeholder="Type (flight, train, bus, ferry)"/>
    </div>

    <div class="form-group">
      <label>Service Number</label>
      <input id="flightNumber" placeholder="Flight / service number" />
    </div>

    <div class="form-group">
      <label>From</label>
      <input id="from" placeholder="From" required />
    </div>

    <div class="form-group">
      <label>To</label>
      <input id="to" placeholder="To" required />
    </div>

    <div class="form-group">
      <label>Departure</label>
      <input id="departureDate" type="date" required />
      <input id="departureTime" type="time" required />
    </div>

     <div class="form-group">
      <label>Arrival</label>
      <input id="arrivalDate" type="date" required />
      <input id="arrivalTime" type="time" required />
    </div>

    <div class="form-group">
      <label>Booking Code</label>
      <input id="confirmationCode" placeholder="Confirmation Code" />
      <input id="bookingUrl" placeholder="Link" />
    </div>

    <div class="form-group">
      <label>Cost</label>
      <input id="cost" type="number" />
    </div>

    <div class="form-group">
      <label>Currency</label>
      <input id="currencyCode" />
    </div>


    <div class="actions">
      <button type="button" class="secondary" id="cancelTransport">Cancel</button>
      <button type="submit" class="primary" id="saveTransport">Save</button>
    </div>
  </div>
</div>
</form>

<script type="module" src="../js/editTransport.js"></script>
</body>
</html>
