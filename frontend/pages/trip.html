<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Trip</title>

  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/trip.css" />
</head>
<body>

<!-- ================= TOP BAR ================= -->
<header class="trip-header">
   <button id="indexBtn" class="secondary">Home</button>
    <button id="editTripBtn" class="primary">✏️ Edit trip</button>
    <button id="exportPdfBtn" class="primary">📄 Export PDF</button>

  <h1 id="tripTitle"></h1>

  <div class="trip-meta">
    <span id="people"></span>
    <span id="activeVersion"></span>
  </div>
</header>

<!-- ================= MAIN LAYOUT ================= -->
<main class="trip-layout">

  <!-- ===== TIMELINE / DAYS ===== -->
  <section class="timeline-section">
    <h2>Timeline</h2>
    <div id="dayCards" class="day-cards"></div>

  </section>

  <!-- ===== SUMMARY ===== -->
  <aside class="summary-section">
    <h3>Summary</h3>
    <div id="summaryCards"></div>
  </aside>

</main>

<!-- ================= SCRIPT ================= -->
<script type="module" src="../js/trip.js"></script>

</body>
</html>
