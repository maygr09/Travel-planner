<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Trip</title>
  <link rel="stylesheet" href="../css/trip.css" />
  <link rel="stylesheet" href="../css/styles.css" />

  <style>
    body { font-family: Arial; max-width: 900px; margin: auto; }
    section { margin-bottom: 30px; }
    .item { border-bottom: 1px solid #ddd; padding: 10px 0; }
    a { color: blue; text-decoration: none; }
  </style>
</head>
<body>

<h1 id="tripTitle">Trip</h1>
<p id="people"></p>
<p id="activeVersion"></p>

<hr />

<div class="layout">

  <main class="main">
    <section>
      <h2>Timeline</h2>
    <div id="timeline"></div>
    </section>
  </main>

  <aside class="sidebar">
    <section>
      <h3><Summary></h3>
      <div id="summaryCards"></div>
    </section>
  </aside>

</div>

<script type="module" src="../js/trip.js"></script>
</body>


<section>
  <h2>Timeline</h2>
  <div id="timeline"></div>
</section>

<section>
  <h2>Summary</h2>

  <div id="summaryCards" class="summary-grid"></div>
</section>

<section>
  <h2>Daily plan</h2>
  <div id="dayCards"></div>
</section>


<section>
  <h2>Transports</h2>
  <div id="transportList"></div>
</section>

<section>
  <h2>Activities</h2>
  <div id="activityList"></div>
</section>

<section>
  <h2>Meals</h2>
  <div id="mealList"></div>
</section>

<section>
  <h2>Accommodation</h2>
  <div id="accommodationList"></div>
</section>

<hr />


<script type="module" src="../js/trip.js"></script>
</body>
</html>
