<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Edit meal</title>
</head>
<body>

  <link rel="stylesheet" href="../css/forms.css" />
<form id="editForm">
<div class="page">
  <div class="card">
    <h1>Edit Meal</h1>

    <div class="form-group">
      <label>Name</label>
      <input id="name" placeholder="Meal/Restaurant"/>
    </div>

    <div class="form-group">
      <label>Start date</label>
      <input id="startDate" type="date" />
    </div>

    <div class="form-group">
      <label>Start time</label>
      <input id="startTime" type="time" />
    </div>

    <div class="form-group">
      <label>End date</label>
      <input id="endDate" type="date" />
    </div>

    <div class="form-group">
      <label>End time</label>
      <input id="endTime" type="time" />
    </div>

    <div class="form-group">
      <label>Confirmation Code</label>
      <input id="confirmationCode" />
      <input id="bookingUrl" placeholder="link" />
    </div>

    <div class="form-group">
      <label>Cost</label>
      <input id="cost" type="number" />
    </div>

    <div class="form-group">
      <label>Currency</label>
      <input id="currencyCode" />
    </div>

    <div class="actions">
      <button type="button" class="secondary" id="cancelMeal">Cancel</button>
      <button type="submit" class="primary" id="saveMeal">Save</button>
    </div>
  </div>
</div>
</form>



<script type="module" src="../js/editMeal.js"></script>
</body>
</html>
