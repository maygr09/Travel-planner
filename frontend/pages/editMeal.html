<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Edit Meal</title>

  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/trip.css" />
  <link rel="stylesheet" href="../css/forms.css" />
</head>
<body>

<form id="editForm">
  <div class="page">
    <div class="card">
      <h1 id="title">Edit Meal</h1>

    <div class="form-group">
      <label>Name</label>
      <input id="name" />
    </div>

    <div class="form-group">
      <label>Start date</label>
      <input id="startDate" type="date" />
    </div>

    <div class="form-group">
      <label>Start time</label>
      <input id="startTime" type="time" />
    </div>

    <div class="form-group">
      <label>End date</label>
      <input id="endDate" type="date" />
    </div>

    <div class="form-group">
      <label>End time</label>
      <input id="endTime" type="time" />
    </div>

   <div class="form-group">
      <label>Confirmation Code</label>
      <input id="confirmationCode" type="text" />
    </div>

       <div class="form-group">
      <label>Booking URL</label>
      <input id="bookingUrl" type="url" />
    </div>

    <div class="form-group">
      <label>Cost</label>
      <input id="cost" type="number" />
    </div>

    <div class="form-group">
      <label>Currency</label>
      <input id="currencyCode" />
    </div>

    <div class="actions">
      <button type="button" class="secondary" id="cancelMeal">
          Cancel
        </button>
        <button type="submit" class="primary">
          Save
        </button>
    </div>
  </div>
</div>
</form>

<script type="module" src="../js/editMeal.js"></script>
</body>
</html>
